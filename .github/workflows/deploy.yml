name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches:
      - "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build the application
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Verify generated WAR file
      - name: Verify Build Output
        run: ls -la target/

      # 5. Copy WAR file to EC2
      - name: Copy WAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/app"

      # 6. Restart application on EC2
      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Stop existing Spring Boot application
            sudo pkill -f java || true

            # Start new application
            nohup java -jar /home/ec2-user/app/target/*.war \
              > /home/ec2-user/app/app.log 2>&1 &
